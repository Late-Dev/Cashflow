version: "3.5"

services:

  backend:
    build: ./backend
    command: bash run_server.sh
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      TOKEN: ${TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      BOT_SECRET: ${BOT_SECRET}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY}
    networks:
      - postgres
    depends_on:
      - db
    restart: always

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cashflow
    networks:
      - postgres

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "3003:80"
    networks:
      - postgres
    restart: always

  frontend:
    build: 
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - postgres
    restart: always

  bot:
    build: ./bot
    environment:
      TOKEN: ${TOKEN}
      WEBAPP_URL: ${WEBAPP_URL}
      API_URL: ${BOT_API_URL}
      BOT_SECRET: ${BOT_SECRET}
      WEBAPP_TG_URL: ${WEBAPP_TG_URL}
    networks:
      - postgres
    restart: always

networks:
  postgres:
    driver: bridge
